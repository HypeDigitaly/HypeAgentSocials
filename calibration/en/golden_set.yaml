# English judge golden set — Phase 0 calibration artefact
# Governing plan sections: ARCHITECTURE_PLAN.md §14.2 (judge calibration and
# false-positive economics), §14.4 (English rubric), §17.2 Phase 0, ruling R2-M15.
#
# Purpose: human-vs-judge agreement measurement, tracked BY DIRECTION
# (judge-passed/human-failed tuned separately from judge-failed/human-passed).
# Until this set produces stable verdicts run by hand, the English judge runs
# deliberately lenient and the English flag-rate ceiling is recorded as inactive.
#
# English rubric dimensions (§14.4): hook-shape, specificity-proof, personal-stake,
# rhythm, structure, cta-target-tone; plus banned-patterns (lexicon + cross-pack
# recurrence, §14.2 layer 1) which the judge sees as context.
#
# Provenance classes: adapted-positive | deliberate-negative | borderline.
# NOTE: real borderline drafts from pilot runs (§14.2) cannot exist before Phase 2;
# the borderlines below are authored stand-ins and should be progressively replaced
# by real pilot-run drafts, with each replacement logged.
#
# STATUS: DRAFT — adapted positives are edits of corpus posts and need operator
# approval before the set is frozen for calibration.

meta:
  language: en
  version: 0.1-draft
  item_count: 18
  authored: 2026-08-06
  needs_operator_approval:
    - en-gp-01
