items:
  - id: ev-en-01
    input_type: linkedin-post-draft
    expectation: known-good
    expected_verdict: pass
    why: "Concrete observation hook, owned numbers, single soft CTA."
    text: |
      We audited 31 cold email accounts this spring. 19 of them were landing in spam and the senders had no idea.

      The pattern was the same every time: one domain doing outreach and newsletters and billing, no warmup, and a list nobody had cleaned since 2024.

      Fixing it was boring. Separate sending domain, three weeks of warmup, remove every address that never opened anything.

      Reply rates didn't jump because the copy got better. They jumped because the emails started arriving.

      If you want the checklist we use for these audits, it's on our site.

  - id: ev-en-02
    input_type: linkedin-post-draft
    expectation: known-bad
    expected_verdict: fail
    why: "Scene-setting throat-clear opener, buzzword chain, no facts."
    text: |
      In an era of unprecedented digital transformation, forward-thinking sales organizations are harnessing the power of artificial intelligence to redefine what's possible in customer acquisition. The journey to excellence begins with embracing innovation at every touchpoint of the revenue engine.

  - id: ev-en-03
    input_type: linkedin-post-draft
    expectation: known-bad
    expected_verdict: fail
    why: "Vague proof ('incredible results'), hype emoji, urgency-bait CTA stack."
    text: |
      Our clients are seeing INCREDIBLE results with our new AI workflow! 🚀🔥

      This is your sign to stop doing outreach the old way.

      Drop a "READY" in the comments, smash that repost button, and follow me so you don't miss part 2 — spots are filling up fast!

  - id: ev-en-04
    input_type: carousel-copy-draft
    expectation: known-good
    expected_verdict: pass
    why: "One idea per slide, concrete nouns, clean arc, single CTA on the last slide."
    text: |
      S1: Your CRM is lying to you.
      S2: 23% of B2B contact data goes stale every year.
      S3: Job changes are the biggest single cause.
      S4: A stale contact isn't neutral — it costs a bounce, and bounces cost deliverability.
      S5: Fix: verify before every campaign, not once a quarter.
      S6: Fix: track job-change signals — the person who left is a warm door at their new company.
      S7: We wrote the verification workflow up as a guide — link below.

  - id: ev-en-05
    input_type: carousel-copy-draft
