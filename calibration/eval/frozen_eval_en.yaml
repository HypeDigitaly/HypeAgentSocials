      S2: Work smarter, not harder
      S3: Efficiency at scale
      S4: Growth without limits
      S5: The future is automated
      S6: Book a demo today
      S7: Or download our free ebook now!

  - id: ev-en-06
    input_type: short-form-script-draft
    expectation: known-good
    expected_verdict: pass
    why: "Direct problem hook inside 3 seconds, spoken-register short sentences, claim payload kept out of audio."
    text: |
      (0-3s) Your follow-up timing is killing your reply rate.
      (3-10s) Most people follow up an hour after the first message. That reads as pressure.
      (10-20s) Wait three days. The message lands as a reminder, not a chase.
      (20-28s) One change, nothing else. Try it on your next ten conversations.
      (28-32s) Full breakdown in the description.

  - id: ev-en-07
    input_type: short-form-script-draft
    expectation: known-bad
    expected_verdict: fail
    why: "Curiosity-gap tease held for the entire runtime; the reveal never comes; spoken superlatives."
    text: |
      (0-4s) Nobody is talking about this one insane growth hack...
      (4-12s) It's the secret behind every seven-figure agency you follow. And it's hiding in plain sight.
      (12-22s) The biggest names don't want you to know it. That's why you've never heard it explained.
      (22-30s) Follow and comment "SECRET" — I'll reveal everything in part 2.

  - id: ev-en-08
    input_type: caption-draft
    expectation: known-good
    expected_verdict: pass
    why: "Message complete in the first 125 characters, link-in-bio shaped CTA for a non-clickable platform."
    text: |
      Three days, not three hours — the follow-up timing that doubled our reply rate. Step-by-step breakdown on the site, link in bio.

  - id: ev-en-09
    input_type: caption-draft
    expectation: known-bad
    expected_verdict: fail
    why: "Front-loads nothing, buries the point after the fold, pastes a raw URL on a platform where captions aren't clickable."
    text: |
      So we've been experimenting with a bunch of different approaches lately and honestly it's been quite a journey with lots of learnings along the way... anyway if you're curious about what we found out about follow-up timing, check https://example.com/blog/follow-up-timing

  - id: ev-en-10
    input_type: linkedin-post-draft
    expectation: known-good
    expected_verdict: pass
    why: "Personal stake with a failure admitted; specific numbers; no CTA at all — must still pass."
    text: |
      Our first automated campaign was a faceplant. 400 messages, 3 replies, one of them telling us to stop.

      The mistake wasn't automation. It was that we automated a bad manual process — same generic opener, just faster.

      The second campaign went out to 60 people, each picked because of a concrete trigger. 14 replies.

      Smaller list, better reason to write. That lesson cost us a month and I'd pay it again.

