# Czech judge golden set — Phase 0 calibration artefact
# Governing plan sections: ARCHITECTURE_PLAN.md §14.2 (judge calibration), §14.4
# (the eleven Czech dimensions — five inherited + five Czech-specific + one Czech
# override), §17.2 Phase 0, rulings R3-M5 and OD-20.
#
# THE RUBRIC IS A HYPOTHESIS, NOT A LAW (R3-M5): the Czech exemplar corpus does not
# exist until Phase 0 builds it, so the human-vs-judge agreement data from THIS SET
# decides which dimensions actually discriminate Czech voice for this brand.
# Dimensions that do not discriminate are down-weighted or merged, logged (OD-20).
#
# Negatives are seeded from machine-translated English marketing copy (plan §3.4,
# §17.2): translationese is precisely the failure mode the rubric exists to catch.
# Each negative cites its English source sentence.
#
# Dimension keys (§14.4):
#   d1  hook-shape               (inherited; fail = transplanted English hook rhythm)
#   d2  specificity-proof        (inherited)
#   d3  structure-formatting     (inherited)
#   d4  cta-target-tone          (inherited)
#   d5  banned-patterns          (inherited; engine/theme lexicons + recurrence)
#   d6  calque-avoidance         (Czech-specific; blocklist with native alternatives)
#   d7  register-vykani          (Czech-specific; vykání default, flips fail both ways)
#   d8  code-switching           (Czech-specific; allowlist is a PERMISSION list)
#   d9  czech-structural-tells   (Czech-specific; openers, hedge stacking)
#   d10 sentence-rhythm-cs-band  (Czech-specific; band from Czech corpus only)
#   d11 human-voice-weighting    (Czech override; a weight, not an extra test)
#
# Coverage note: all eleven dimensions are exercised by at least one item below.
# d5 is only PARTIALLY testable in Phase 0 — the engine/theme seed lexicons are a
# separate Phase-0 configuration deliverable; cs-gn-12 exercises the generic pattern
# class and must be re-checked against the seeded lexicon once it exists.
#
# STATUS: DRAFT — adapted positives are authored Czech drafts (no real Czech corpus
# exists yet) and need operator approval; borderlines are authored stand-ins to be
# replaced by real pilot-run drafts as they appear (§14.2), each replacement logged.

