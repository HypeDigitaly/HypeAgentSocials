# 499f47a8-fbfa-4a20-ad47-f0f5989cf3b7). The engine has no Notion credential,
# so runs consume the latest dated snapshot in this directory and record its
# snapshot_id in every pack's fact-usage trace. Refresh = re-query Notion,
# write a new dated file, never edit an old one. If the snapshot is older than
# max_age_days, the brand-truth stage degrades per §6.5 (stale snapshot).
#
# Row semantics (Notion schema): Stav (schváleno/ověřit/nepoužívat/starší),
# Chování AI (citovat = may cite verbatim · kvalifikovat = cite only with the
# stated qualification · abstain = never state). Only Stav=schváleno rows are
# included in a snapshot by rule.
#
# NOTE the standing F-F policy (config/brand_facts.yaml): prices-never-stated.
# The pricing rows below are carried faithfully because the snapshot must
# mirror the ledger, but generated copy may not state price values while that
# policy stands — the claim gate enforces policy AFTER ledger membership.

