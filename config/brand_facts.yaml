# --- F-F pricing policy (POLICY, not values — values are F-G, site-verified) ---
pricing_policy:
  policy: "prices-never-stated"
  rationale: >
    Safe default per §6.3. Prices may be quoted only from Notion 'Ceny a nabídky'
    and only 🟢 items (hub rule), and the historical-pricing hazard (🟡 pages with
    obsolete tiers) makes any generated price statement a claim-gate liability.
    Generated copy therefore states no prices, ever; CTAs route to the live
    pricing pages instead. Change requires an operator decision row.

# --- F-J pointer (hard excludes live in their own file; union wins) -------------
hard_excludes_ref: "config/hard_excludes.yaml"

# --- Notes for the spin stage ----------------------------------------------------
spin_notes:
  offer_adjacency: >
    Default mapped offer for AI-trend topics is capability-level (chatbots /
    automation / HypeLead as adjacent), never a hard pitch; mapping distance
    rules in §6.9 govern. The claim ledger (Čísla a sliby, 10 approved rows)
    is the ONLY source of citable numbers.
  voice_reference: >
    Voice exemplars come from the calibration corpus; the model picks per
    asset at run time (W8-6). EN marketing voice exists only as translations
    of Czech web copy — keep EN copy plain, concrete, no hype inflation.
