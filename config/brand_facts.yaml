# Brand-truth seed — config-side fact classes for M3 (goal-scoped Phase 2)
# ---------------------------------------------------------------------------
# Written 2026-08-07 as the M3 build input (GOAL_ROADMAP.md). Sources: Notion
# Second Brain (docs/research/NOTION_KB_INVENTORY.md, live-read 2026-08-07;
# corpus snapshot 2026-08-05) + company registry facts already on record.
#
# Semantics (ARCHITECTURE_PLAN.md §6.3–6.4):
# - This file is the CONFIG side of brand truth. Notion stays primary where
#   the fact-location map says so (config/notion_fact_locations.yaml).
# - F-G price values and F-H claims are NOT here and never will be: claims
#   live in Notion "Čísla a sliby" (referenced by id, fetched/snapshotted at
#   run time), and the standing pricing POLICY below makes price values
#   unnecessary for generated copy.
# - Empty list = RESOLVED-EMPTY (a decision), missing key = UNRESOLVED
#   (fail closed) — same loader semantics as every other config file.
# - Every fact carries source + verified date so the digest's fact-usage
#   trace can cite it.

