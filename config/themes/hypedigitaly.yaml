# =============================================================================
# THEME: hypedigitaly — Phase-1 minimal research block (§10.2)
# =============================================================================
# Governing plan: docs/architecture/ARCHITECTURE_PLAN.md §10.2 (research
# block), §2.3 (source portfolio), §2.7 (ranking architecture), §17.2
# (Phase-1 scope). This is the narrowest theme config Phase 1 needs: an
# AI agency's watch topics/ICP terms, the four free collectors' per-source
# budgets and families, and the ranking-config block with
# `ranking_config_version: 1`.
#
# FAIL-CLOSED: missing or unreadable -> ConfigError (hypeagent.config_load
# .load_theme_research_config). A run cannot collect or rank without
# knowing what it is watching for.
# =============================================================================

theme:
  name: hypedigitaly
  languages: [en, cs]

research:
  # Watch topics: the seed for every query-shaped collector and the
  # reference set for the Phase-1 deterministic brand-fit heuristic.
  watch_topics:
    en:
      - "AI agents"
      - "chatbots"
      - "lead generation"
      - "sales automation"
      - "RAG"
      - "retrieval augmented generation"
      - "voice agents"
      - "voice AI"
      - "LLM apps"
      - "customer support automation"
      - "AI sales"
      - "outbound automation"
    cs:
      - "AI agenti"
      - "chatboti"
      - "generování leadů"
      - "automatizace prodeje"
      - "hlasoví asistenti"
      - "hlasové AI"
      - "LLM aplikace"
      - "automatizace zákaznické podpory"
      - "AI v prodeji"

  # ICP terms: who this brand sells to — used the same way as watch topics
  # in the Phase-1 fit heuristic (§2.7: "weighted keyword/term overlap
  # against the theme's watch topics + ICP terms").
  icp_terms:
    en:
      - "agency"
      - "marketing agency"
      - "sales team"
      - "SaaS"
      - "SDR"
      - "outbound"
      - "small business"
    cs:
      - "agentura"
      - "marketingová agentura"
      - "obchodní tým"
      - "malá firma"

  # Source roster (§2.3), Phase-1: the four free collectors only.
  sources:
    hacker_news:
      enabled: true
      family: developer_technical_discourse
      budget_max_calls: 40   # topstories + up to 39 item fetches
      circuit_breaker_threshold: 3

    google_news:
      enabled: true
      family_en: editorial_relay
      family_cs: czech_native_news
      circuit_breaker_threshold: 3
      queries:
        en:
          - "AI agents"
          - "AI sales automation"
          - "AI chatbot startup"
          - "voice AI agents"
        cs:
          - "AI agenti"
          - "chatboti pro firmy"
          - "hlasoví asistenti AI"

    hugging_face:
      enabled: true
      family: launch_registries
      limit: 20
      circuit_breaker_threshold: 3

    product_hunt:
      enabled: true
      family: launch_registries
      circuit_breaker_threshold: 3

    # M3 (GOAL_ROADMAP.md), upgraded W8-9 Phase 2: Virlo short-form social
    # intelligence, GET-only, never a POST/create call, never a poll loop
    # (at most one pass over any paginated endpoint per run). key_path is
    # the legacy fallback (relative to the repo root) — VIRLO_API_KEY
    # resolves first from the real environment, then repo-root `.env`
    # (W8-9 Phase 1); fail-closed to "source degraded, run continues" if
    # nothing resolves anywhere (never a hard run failure).
    virlo:
      enabled: true
      family: short_form_trends
      key_path: "secrets/virlo.key"
      monitor_id: "9c96fddf-dc35-4be0-bbd9-12f4d22aea12"  # legacy single-id fallback (unused when monitor_ids is set)
      # Ordered monitor fallback list (W8-9 Phase 2): the new intelligence-
      # enabled v2 monitor first — read each at most once per run, falling
      # through to the next only when the current one has no finalized run
      # yet. The selected (first finalized) monitor is used for BOTH theme
      # extraction and the /videos, /slideshows sub-paths below.
      monitor_ids:
        - "623203a9-c09c-4763-85e0-1c177b5af760"  # "AI Trends Tracker v2 (intelligence)"
        - "9c96fddf-dc35-4be0-bbd9-12f4d22aea12"   # "AI Trends Tracker" (original, cycles Sundays)
      # Raised from 4 (W8-9 Phase 2): 1-2 monitor reads + up to
      # subpath_page_cap pages each for /videos and /slideshows.
      budget_max_calls: 20
      circuit_breaker_threshold: 3
      # The $0.25 trends digest becomes opt-in, off by default — the
      # monitor + sub-path surfaces are free and materially more on-topic.
      trends_digest_enabled: false
      # Hard page cap per sub-path (/videos, /slideshows) — one pass only.
      subpath_page_cap: 6
      # Top-K images (thumbnails + carousel panels) downloaded for the
      # upcoming vision-LLM analysis stage; analysis input only, never
      # re-published, never copied into a pack.
      media_download_cap: 24

ranking:
  ranking_config_version: 1

  # Fit gate.
  brand_fit_floor: 0.35   # directional starting default (§2.7)

  # Top-N cap, applied AFTER filtering (§2.7, §10.2).
  top_n_per_language: 3

  # Freshness half-life per signal class, hours. Directional starting
  # values only (§2.7) — ad-creative is absent in Phase 1.
  freshness_half_life_hours:
    spike: 6
    rising: 24
    launch-hype: 72
    evergreen-pain: 720

  # Baseline window for counted-evidence percentile normalization.
  baseline_lookback_days: 90

  # Absolute-band fallback thresholds, used before ~14 days of trailing
  # baseline exist (§2.7), per counted-evidence source.
  absolute_band_fallback:
    hacker_news:
      low: 5
      mid: 50
      high: 200
    hugging_face:
      low: 10
      mid: 100
      high: 1000
    virlo:
      # views_per_hour (trends digest) / video_count (agent-monitor themes)
      # — directional starting values, no trailing baseline exists yet.
      low: 1000
      mid: 20000
      high: 200000

  # Cross-day dedupe (§2.8a).
  dedupe_lookback_days: 30
  rejection_suppression_days: 14
  corroboration_growth_override_families: 2
  new_angle_min_new_signals: 3

  # Corroboration bonus magnitude (§2.7, §10.2).
  corroboration_bonus: 0.15

  # Per-language minimum evidence-and-volume band (§2.7), loose defaults.
  evidence_floor:
    en:
      min_candidates: 1
      min_families: 1
    cs:
      min_candidates: 1
      min_families: 1

# =============================================================================
# GENERATION (M3, GOAL_ROADMAP.md) — spin/copy/gate knobs, EN only for this
# goal. Additive to the Phase-1 surface above; a theme predating M3 that
# omits this block entirely still runs (interactive-file provider, default
# mapping-distance bands, both goal destinations) — see config_load.py's
# ``load_theme_generation_config`` docstring.
# =============================================================================
generation:
  destinations: [linkedin, instagram_feed]

  # interactive-file (default, costs nothing, the finish-line path for this
  # goal) | openai-compatible-http (generic, config-driven, disabled below —
  # no key exists for this goal).
  copy_provider: interactive-file

  # Combined per-artifact repair ceiling (§14.0): spin/claim regenerate
  # attempts counted together, small and fixed.
  repair_budget: 2

  # Term-overlap score thresholds for spin's near/adjacent/far mapping
  # distance (§6.9). Below adjacent_min is "far" — no offer, no
  # product/product-adjacent CTA, ever (the deterministic spin-gate floor).
  mapping_distance_bands:
    near_min: 0.35
    adjacent_min: 0.12

  # EN structural exemplar pool (§6.11) — pointer only; the copy provider
  # picks per asset (W8-6), the engine does not select for it.
  exemplar_pool:
    - "calibration/en/structural_corpus.md"

  # Disabled: no key exists for this goal. Config-driven so a future key
  # drops in with no code change.
  openai_compatible:
    enabled: false
    base_url: ""
    model: ""
    key_path: ""
    max_tokens: 400

  # M4 (GOAL_ROADMAP.md) — Kie.ai draft-tier image generation. Both caps
  # are checked at every submission (§8.11); whichever trips first stops
  # that submission, and count-capped/budget-capped are distinct statuses.
  # dry_run stays false here deliberately: the goal's finish line is a real
  # (bounded) spend test, and this milestone's own real-submission
  # verification requires it off. A theme wanting a zero-spend rehearsal
  # sets dry_run: true, which still produces the full plan and forecast.
  media:
    dry_run: false
    per_run_usd_cap: 0.20
    per_run_count_cap: 4
    per_day_usd_cap: 0.40
    poll_interval_seconds: 7
    poll_timeout_seconds: 180
    resolution_window_days: 14
    aspect_ratio: "1:1"
    output_format: "png"
    # key_path left empty -> falls back to secrets/kie.key (repo-root relative)
