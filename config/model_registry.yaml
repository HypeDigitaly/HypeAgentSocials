# Model registry — image routes only (M4 seed, goal-scoped Phase 3)
# ---------------------------------------------------------------------------
# Authored 2026-08-07. §5.2: the registry names routes, tiers and PRICE
# SNAPSHOTS (dated — the digest's cost forecast reads these, never hard-coded
# figures). Video/voice routes are deliberately absent: the W8-7 goal is
# image generation only. Price snapshots taken 2026-08-07 from kie.ai public
# pricing pages (credit ≈ $0.005; account balance 10,080 credits ≈ $50).
#
# VERIFICATION STATUS (M4, 2026-08-07): `model` strings verified against
# docs.kie.ai (curled market pages directly, not the JS-rendered nav) --
# request/response shapes below are read from documented examples AND
# confirmed live: two real createTask + recordInfo round trips against
# "google/nano-banana" (one plain submission, one deliberate kill-before-poll
# + resolve-by-query on restart), 8 credits total ($0.04), both delivered a
# real 1024x1024 PNG, "model" echoed the request in both (no substitution
# observed -- consistent with, not proof of, the three-state rule below),
# balance dropped by exactly 4 credits per submission and by zero on the
# resolve-by-query call itself. Seedream/nano-banana-2 strings are corrected
# from docs but not yet exercised against a live submission.
# - google/nano-banana        -- exact match, docs.kie.ai/market/google/nano-banana
#                                 request example: {"model":"google/nano-banana",
#                                 "input":{"prompt":...,"output_format":"png",
#                                 "aspect_ratio":"1:1"}}
# - bytedance/seedream-v4-text-to-image -- corrected; the seed value
#   "bytedance/seedream-4" did not exist on docs.kie.ai. Verified string is
#   from docs.kie.ai/market/seedream/seedream-v4-text-to-image.
# - nano-banana-2             -- corrected; no "google/" prefix and no
#   "-pro" suffix exist on docs.kie.ai (there is no nano-banana-pro page at
#   all). Verified string + page: docs.kie.ai/market/google/nanobanana2.
#   LIVE-VERIFIED 2026-08-07 (W8-9 Q4, operator-authorized bounded-spend
#   test): one real createTask + recordInfo round trip through the actual
#   MediaGenerator code path (task id 096f35cc2401b0c67d2d85112b7258d8),
#   requesting a 1024x1024-class 1:1 PNG with an on-image text overlay and a
#   handle -- delivered a real image with the requested headline rendered
#   correctly (confirmed separately by a live N-E vision-QA call). Account
#   balance dropped from 10064 to 10056 credits -- exactly 8 credits
#   ($0.04 at credit_usd=0.005), matching the "creditsConsumed" field on the
#   recordInfo response exactly. This CORRECTS the old directional estimate
#   of 24 credits ($0.12) below -- the real price is a third of that
#   estimate. "model" echoed the request (no substitution observed, same
#   caveat as the draft-tier note above: consistent with, not proof of, the
#   three-state rule).
#
# Router facts that bind M4 (from W8-3 inspection + docs, confirmed live):
# - createTask: POST https://api.kie.ai/api/v1/jobs/createTask
#   body: {"model": <string>, "input": {...}} -- "callBackUrl" is optional
#   and omitted (polling baseline, no webhook receiver, §8.13).
#   response: {"code":200,"msg":"success","data":{"taskId":"..."}}
# - status:     GET  https://api.kie.ai/api/v1/jobs/recordInfo?taskId=...
#   response: {"code":200,"msg":"success","data":{"taskId","model","state"
#   (docs example shows "success"; "waiting"/"fail" inferred from
#   failCode/failMsg/progress fields),"resultJson" (JSON string holding
#   "resultUrls":[...]),"failCode","failMsg","creditsConsumed",...}}.
#   The docs example shows "model" echoing the request -- it is NOT treated
#   as a trustworthy identity signal on its own; §5.6's three-state
#   inference still governs (identity-reported only when this field
#   diverges from the requested model_string; substituted-unknown on any
#   other divergence signal; assumed-as-requested otherwise).
# - credit balance: GET https://api.kie.ai/api/v1/chat/credit ->
#   {"code":200,"msg":"success","data": <int credits>}.
# - NO idempotency key exists on task creation (§8.5: the write-ahead spend
#   ledger row IS the idempotency mechanism; resolve-by-query on restart).
# - People-free composition stays the injected default (R2-M18).

meta:
  registry_version: 1
  price_snapshot_date: "2026-08-07"
  credit_usd: 0.005
  provider: "kie.ai"
  create_task_url: "https://api.kie.ai/api/v1/jobs/createTask"
  record_info_url: "https://api.kie.ai/api/v1/jobs/recordInfo"

routes:
  - route_id: img-draft-nano-banana
    tier: draft
    display: "Nano Banana (Gemini 2.5 Flash Image)"
    model_string: "google/nano-banana"        # VERIFIED 2026-08-07 vs docs.kie.ai/market/google/nano-banana
    price_credits: 4
    price_usd: 0.02
    input_params: {prompt: string, output_format: "png", aspect_ratio: "1:1"}
    notes: "Default draft route — cheapest adequate; strong text rendering claims (never exercised — no text is composed into the prompt this milestone)"

  - route_id: img-draft-seedream
    tier: draft
    display: "Seedream 4.0 (text-to-image)"
    model_string: "bytedance/seedream-v4-text-to-image"  # CORRECTED 2026-08-07: "bytedance/seedream-4" does not exist on docs.kie.ai; verified vs docs.kie.ai/market/seedream/seedream-v4-text-to-image
    price_credits: 3.5
    price_usd: 0.0175
    notes: "Fallback draft route (registered fallback needs its own param conformance check, §5.7) — param shape not yet exercised against a live submission this milestone"

  - route_id: img-standard-nano-banana-pro
    tier: standard
    display: "Nano Banana 2"
    model_string: "nano-banana-2"    # CORRECTED 2026-08-07: no "google/" prefix, no "-pro" suffix — no nano-banana-pro page exists on docs.kie.ai; verified vs docs.kie.ai/market/google/nanobanana2
    price_credits: 8    # LIVE-VERIFIED 2026-08-07 (W8-9 Q4): balance dropped 10064 -> 10056 on one real submission; corrects the prior 24-credit directional estimate
    price_usd: 0.04
    notes: "Standard-tier default route (W8-9 Q4: route_by_class in a theme's media config points hero/slide here by default) — text-in-image and a handle both rendered correctly on the one live-verified round trip; price re-verified live, not a carry-over estimate anymore"

defaults:
  draft_route: img-draft-nano-banana
  fallback_draft_route: img-draft-seedream
  # W8-9 Q4: raised draft -> standard -- the goal's finish line is a real
  # standard-tier (nano-banana-2) test run. tier_ceiling still fail-closes
  # anything above it (there is no tier above standard registered here);
  # media_gen.py's route-selection now does a genuine tier-ORDER comparison
  # (draft < standard) rather than the two old literal "== draft" hard-raises.
  tier_ceiling: standard
  # W8-9 Q4: superseded -- media_gen.compose_prompt no longer branches on
  # this (the buggy substring filter it drove is deleted outright, not
  # patched); the W8-9 negative-constraint set has no "no people" clause to
  # filter in the first place. Left loaded, unused, for config back-compat.
  people_free_composition: true
  policy_a_no_product_depiction: true
