# -----------------------------------------------------------------------------
# RECORD SCHEMA — template for one ledger entry, commented out until the
# first genuinely approved claim exists. Field set is exactly F-H (§6.3)
# plus the per-entry states other sections require of an entry.
# -----------------------------------------------------------------------------
# claims:
#   - id: ""                      # stable entry identifier — consumed by the
#                                 # fact-usage trace (§6.6a/§6.6: "claim-ledger
#                                 # entry identifiers that this specific topic
#                                 # pack actually consumed")
#     text:                       # F-H: "text per language" — the approved
#       en: ""                    #   claim wording, per language; never a
#       cs: ""                    #   machine translation of the other language
#     claim_type: ""              # F-H: "claim type". Vocabulary aligns with
#                                 # the §6.7 check classes that consume the
#                                 # ledger (e.g. numeric, currency/price,
#                                 # outcome/result, superlative, capability,
#                                 # temporal, comparative, endorsement)
#     provenance: ""              # F-H: "provenance" — where this claim comes
#                                 # from, entered with the entry (§6.4)
#     evidence_pointer: ""        # F-H: "evidence pointer" — link/reference to
#                                 # the evidence substantiating the claim
#     valid_from: ""              # F-H: "valid-from" (ISO date)
#     valid_until: ""             # F-H: "valid-until" (ISO date). §6.6: claims
#                                 # expiring within 30 days are listed in the
#                                 # digest by the claim-ledger expiry sweep —
#                                 # "otherwise proof silently vanishes from
#                                 # content one day and nobody knows why the
#                                 # posts got vaguer"
#     usage_scope: ""             # F-H: "usage scope" — where/how the claim
#                                 # may be used
#     confidence: ""              # §6.5 PARTIAL row: proof claims at PARTIAL
#                                 # are blocked "unless that individual ledger
#                                 # entry is itself at full confidence" — so
#                                 # confidence is a per-entry state
#     status: ""                  # active | quarantined | expired.
#                                 # §6.4 F-H row: a site contradiction
#                                 # "quarantines that entry" (red-flag path);
#                                 # quarantined entries are unusable until a
#                                 # human resolves the conflict
# -----------------------------------------------------------------------------

